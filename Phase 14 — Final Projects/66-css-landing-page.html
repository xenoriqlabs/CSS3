<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Xenoriq Labs - Modern software company building web applications and AI solutions.">

    <title>Xenoriq Labs | Software Company</title>

    <style>
        /* ========================================
                1. CSS VARIABLES 
         ======================================== */

        :root {
            --primary-color: #2563eb;
            --secondary-color: #7c3aed;

            --background-color: #ffffff;
            --surface-color: #f8fafc;

            --text-color: #0f172a;
            --muted-color: #64748b;

            --border-color: #e2e8f0;

            --white-color: #ffffff;

            --conatainer-width: 1200px;

            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 2rem;
            --spacing-lg: 4rem;
            --spacing-xl: 6rem;

            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 20px;

            --transition: 0.3s ease;
        }

        /* ========================================
           2. CSS RESET
        ======================================== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

                /* ========================================
           3. CONTAINER
        ======================================== */

        .conatiner{
            width: min(100% - 2rem, var(--conatainer-width));
            margin-inline: auto;
        }

                /* ========================================
           4. BASIC SECTION
        ======================================== */

        section{
            padding-block: var(--spacing-xl);
        }

                /* ========================================
           5. TEST HEADING
        ======================================== */

        .section-title{
            text-align: center;
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: var(--spacing-md);
        }

        .section-description{
            max-width: 700px;
            margin-inline: auto;
            text-align: center;
            color: var(--muted-color);
        }
    </style>
</head>

<body>

    <!-- ========================================
         MAIN CONTENT
    ======================================== -->

    <main>
        <section>
            <div class="container">

                <h1 class="section-title">
                    Welcome to Xenoriq Labs 🚀
                </h1>

                <p class="section-description">
                    We build modern web applications,
                    smart AI solutions, and scalable
                    digital products.
                </p>
            </div>
        </section>
    </main>
</body>

</html>

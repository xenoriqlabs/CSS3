<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Saif Ur Rahman - AI Engineer and Founder & CEO of Xenoriq Labs.">

    <title>Saif Ur Rahman | Portfolio</title>

    <style>
        /* ========================================
            1. CSS VARIABLES
        ======================================== */

        :root {
            --primary-color: #2563eb;
            --secondary-color: #7c3aed;

            --background-color: #ffffff;
            --surface-color: #f8fafc;

            --text-color: #0f172a;
            --muted-color: #64748b;

            --border-color: #e2e8f0;

            --container-width: 1200px;

            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 4rem;

            --radius-sm: 0.5rem;
            --radius-md: 1rem;

            --transition: 0.3s ease;
        }

        /* ========================================
            2. CSS RESET
        ======================================== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ul {
            list-style: none;
        }
    </style>
</head>

<body>

</body>

</html>

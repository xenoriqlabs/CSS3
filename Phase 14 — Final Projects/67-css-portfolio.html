<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Saif Ur Rahman - AI Engineer and Founder & CEO of Xenoriq Labs.">

    <title>Saif Ur Rahman | Portfolio</title>

    <style>
        /* ========================================
            1. CSS VARIABLES
        ======================================== */

        :root {
            --primary-color: #2563eb;
            --secondary-color: #7c3aed;

            --background-color: #ffffff;
            --surface-color: #f8fafc;

            --text-color: #0f172a;
            --muted-color: #64748b;

            --border-color: #e2e8f0;

            --container-width: 1200px;

            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 4rem;

            --radius-sm: 0.5rem;
            --radius-md: 1rem;

            --transition: 0.3s ease;
        }

        /* ========================================
            2. CSS RESET
        ======================================== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;

            display: block;
        }

        /* ========================================
                3. CONTAINER
        ======================================== */

        .container {
            width: min(100% - 2rem, var(--container-width));
            margin-inline: auto;
        }

        /* ========================================
                4. HEADER
        ======================================== */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border-color);
        }

        .navbar {
            min-height: 70px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-md);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            white-space: nowrap;
        }

        .logo:hover {
            color: var(--secondary-color);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .nav-links a {
            position: relative;
            color: var(--text-color);
            font-weight: 500;
            transition: color var(--transition);
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .nav-links a::after {
            content: "git";
            position: absolute;
            left: 0;
            bottom: -3px;
            width: 0;
            height: 2px;

            background-color: var(--primary-color);
            transition: width var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .menu-button {
            display: none;
            border: none;
            background-color: transparent;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* ========================================
                10. HERO SECTION
        ======================================== */

        .hero {
            min-height: calc(100vh - 70px);
            display: grid;
            align-items: center;
            padding-block: var(--spacing-xl);
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 4rem;
        }

        .hero-subtitle {
            margin-bottom: var(--spacing-sm);
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .hero-title {
            margin-bottom: var(--spacing-md);
            font-size: clamp(2.8rem, 7vw, 5.5rem);
            line-height: 1.05;
        }

        .hero-title span {
            color: var(--primary-color);
        }

        .hero-description {
            max-width: 650px;
            margin-bottom: var(--spacing-lg);
            color: var(--muted-color);
            font-size: 1.1rem;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.5rem;

            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            font-weight: 700;

            transition:
                transform var(--transition),
                var(--background-color),
                color var(--transition);
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;

        }

        .btn-secondary {
            border-color: var(--primary-color);
            color: var(--primary-color);
            border-color: transparent;
        }

        .btn-secondary:hover {
            border: 2px solid var(--secondary-color);
        }

        /* ========================================
                14. HERO IMAGE
        ======================================== */

        .hero-image {
            display: flex;
            justify-content: center;
        }

        .profile-image {
            width: 100%, 300px;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 50%;

            border: 8px solid var(--surface-color);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);

            transition:
                transform var(--transition) box-shadow var(--transition);
        }

        .profile-image:hover{
            transform: translateY(-8px);
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.2);
        }
    </style>
</head>

<body>

    <!-- ========================================
            HEADER / NAVBAR
    ======================================== -->

    <header class="header">

        <div class="conatiner">

            <nav class="navbar">

                <a href="#" class="logo">
                    Saif Ur Rahman
                </a>

                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#skills">Skills</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>

                <button class="menu-button" type="button">
                    ☰
                </button>

            </nav>

        </div>

    </header>

    <!-- ========================================
            HERO SECTION
    ======================================== -->

    <section class="hero" id="home">

        <div class="container">

            <div class="hero-content">

                <div class="hero-text">

                    <p class="hero-subtitle">
                        👋 Hello, I'm
                    </p>

                    <h1 class="hero-title">
                        Saif Ur <span>Rahman</span>
                    </h1>

                    <p class="hero-description">
                        I'm an AI Engineer and Founder & CEO of Xenoriq Labs.
                        I build modern web applications, AI-powered solutions,
                        and scalable digital products.
                    </p>


                    <div class="hero-buttons">

                        <a href="#projects" class="btn btn-primary">
                            View My Projects
                        </a>

                        <a href="#contact" class="btn btn-secondary">
                            Contact Me
                        </a>

                    </div>


                </div>

                <div class="hero-image">

                    <img src="../media/saif-dp.jpg" alt="Saif Ur Rahman - AI Engineer" class="profile-image">

                </div>

            </div>

        </div>

    </section>

    </main>

</body>

</html>

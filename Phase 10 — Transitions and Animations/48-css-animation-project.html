<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Animation Project</title>

    <style>
        /* GLOBAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            color: #222;
        }

        /* NAVBAR */
        .navbar {
            background-color: #111;
            padding: 20px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;

            transition: all 2s ease 3ms;
        }

        .logo:hover {
            transform: scale(1.2);
            color: orange;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;

            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: orange;
        }

        /* LOADING ANIMATION */
        .loader-section {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #111;
        }

        .loader {
            width: 60px;
            height: 60px;

            border: 6px solid #444;
            border-top-color: orange;

            border-radius: 50%;

            animation: loading 1s linear infinite;
        }

        @keyframes loading {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        /* HERO SECTION */
        .hero{
            min-height: 100vh;
            padding: 80px 8%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 50px;

            overflow: hidden;
        }

        .hero-content{
            max-width: 600px;
            animation: heroText 1s ease-out;
        }

        .hero-content h1{
            font-size: 55px;
            margin-bottom: 20px;
        }

        .hero-content h1 span{
            color: orange;
        }

        .hero-content p{
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
            color: #555;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="#" class="logo">
            Xenoriq Labs
        </a>

        <nav class="nav-links">

            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>

        </nav>

    </header>

    <!-- LOADING ANIMATION -->
    <section class="loader-section">

        <div class="loader"></div>

    </section>

    <!-- HERO SECTION -->
    <section class="hero" id="home">

        <div class="hero-content">

            <h1>
                Build <span>Smart</span> Technology
            </h1>

            <p>
                Xenoriq Labs builds modern web applications,
                AI-powered solutions, and scalable digital products.
            </p>

            <a href="#services" class="hero-button">
                Explore Services
            </a>

        </div>

        <div class="hero-image">
            AI
        </div>

    </section>

</body>

</html>

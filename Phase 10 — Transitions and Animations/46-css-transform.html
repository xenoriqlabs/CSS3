<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Transform</title>

    <style>

        /* =========================
           GLOBAL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        /* =========================
           CONTAINER
        ========================== */

        .container {
            max-width: 1000px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
        }

        .box-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;

            text-align: center;
        }

        .box-container h2 {
            margin-bottom: 20px;
        }

        /* =========================
           COMMON BOX
        ========================== */

        .box {
            width: 150px;
            height: 100px;

            margin: 40px auto;

            background-color: black;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 8px;

            transition: transform 0.5s ease;
        }

        /* =========================
           1. TRANSLATE
        ========================== */

        .translate:hover {
            transform: translate(50px, 20px);
        }

        /* =========================
           2. ROTATE
        ========================== */

        .rotate:hover {
            transform: rotate(45deg);
        }

        /* =========================
           3. SCALE
        ========================== */

        .scale:hover {
            transform: scale(1.3);
        }

        /* =========================
           4. SKEW
        ========================== */

        .skew:hover {
            transform: skew(20deg);
        }

        /* =========================
           5. TRANSFORM ORIGIN
        ========================== */

        .origin:hover {
            transform: rotate(45deg);

            transform-origin: top left;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            .container {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <h1>CSS Transform</h1>

    <div class="container">

        <!-- Translate -->

        <div class="box-container">

            <h2>translate()</h2>

            <p>Moves the element.</p>

            <div class="box translate">
                Translate
            </div>

        </div>


        <!-- Rotate -->

        <div class="box-container">

            <h2>rotate()</h2>

            <p>Rotates the element.</p>

            <div class="box rotate">
                Rotate
            </div>

        </div>


        <!-- Scale -->

        <div class="box-container">

            <h2>scale()</h2>

            <p>Increases or decreases the size.</p>

            <div class="box scale">
                Scale
            </div>

        </div>


        <!-- Skew -->

        <div class="box-container">

            <h2>skew()</h2>

            <p>Tilts the element.</p>

            <div class="box skew">
                Skew
            </div>

        </div>


        <!-- Transform Origin -->

        <div class="box-container">

            <h2>transform-origin</h2>

            <p>Changes the point of transformation.</p>

            <div class="box origin">
                Origin
            </div>

        </div>

    </div>

</body>

</html>

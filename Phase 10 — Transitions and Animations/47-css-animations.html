<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Animations</title>

    <style>
        /* GLOBAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px;
        }

        /* CONTAINER */

        .container {
            width: 100%;
            max-width: 900px;

            background-color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        .description {
            margin-bottom: 40px;
            color: #555;
        }

        /* ANIMATION AREA */
        .animation-area {
            width: 100%;
            height: 150px;

            background-color: #eeeeee;
            border-radius: 10px;

            display: flex;
            align-items: center;

            padding: 20px;
        }

        /* ANIMATED BOX */
        .box {
            width: 100px;
            height: 100px;

            background-color: black;
            color: white;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            /* Animation properties */
            animation-name: moveBox;
            animation-duration: 3s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-fill-mode: both;
            animation-timing-function: ease-in-out;
        }

        /* KEYFRAMES */
        @keyframes moveBox {

            from {
                transform: translate(0);
                background-color: black;
            }

            to {
                transform: translate(650px);
                background-color: orange;
            }

        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            .container {
                padding: 25px;
            }

            .animation-area {
                height: 120px;
            }

            .box {
                width: 70px;
                height: 70px;
            }

            @keyframes moveBox {

                from {
                    transform: translate(0);
                    background-color: black;
                }

                to {
                    transform: translate(250px);
                    background-color: orange;
                }

            }

        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CSS Animations</h1>

        <p class="description">
            The box moves automatically using CSS animation.
        </p>

        <div class="animation-area">

            <div class="box">
                Xenoriq
            </div>

        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors</title>

    <style>
        /* Named Color */
        .named-color {
            color: red;
        }

        /* HEX Color */
        .hex-color {
            color: #0040ca;
        }

        /* RGB Color */
        .rgb-color {
            color: rgb(0, 128, 0);
        }

        /* RGBA Color */
        .rgba-color {
            color: rgba(255, 0, 0, 0.5);
        }

        /* HSL Color */
        .hsl-color {
            color: hsl(240, 100%, 50%);
        }

        /* HSLA Color */
        .hsla-color {
            color: hsla(120, 100%, 50%, 0.5);
        }

        /* Background Color */
        .background-color {
            background-color: #e9eff9;
        }

        /* Border Color */
        .border-color {
            border: 3px solid #0040ca;
        }

        /* Opacity */
        .opacity {
            background-color: orange;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <h1>CSS Colors</h1>

    <p class="named-color">
        This text uses a named color.
    </p>

    <p class="hex-color">
        This text uses a HEX color.
    </p>

    <p class="rgb-color">
        This text uses an RGB color.
    </p>

    <p class="rgba-color">
        This text uses an RGBA color.
    </p>

    <p class="hsl-color">
        This text uses an HSL color.
    </p>

    <p class="hsla-color">
        This text uses an HSLA color.
    </p>

    <p class="background-color">
        This element has a background color.
    </p>

    <p class="border-color">
        This element has a colored border.
    </p>

    <p class="opacity">
        This element has 50% opacity.
    </p>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic CSS</title>
    <style>
        h1 {
            color: red;
        }

        p {
            color: gray;
            font-size: 22px;
            background-color: lightgray;
        }

        .learning {
            color: green;
        }

        h2 {
            color: purple;
        }
    </style>
</head>

<body>
    <div>
        <h1>Welcome to CSS3</h1>
        <p>
            CSS3 is used to style and design HTML webpages.
        </p>
        <p class="learning">
            I am learning CSS3 step by step.
        </p>
        <h2>My CSS Journey</h2>
    </div>
</body>

</html>

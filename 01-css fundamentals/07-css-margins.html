<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Margins</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .box {
            width: 200px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid black;

            margin: 30px;
        }

        .box1 {
            margin-top: 50px;
        }

        .box2 {
            margin-right: 50px;
        }

        .box3 {
            margin-bottom: 150px;
        }

        .box4 {
            margin-left: 100px;
        }

        .center-box {
            width: 300px;
            height: 100px;
            background-color: lightgreen;
            border: 2px solid black;

            margin: auto;
        }
    </style>
</head>

<body>

    <h1 style="text-align: center;">CSS Margins</h1>
    <hr style="border-top: 2px solid aqua; width: 90%;">

    <div class="box box1">
        Margin Top
    </div>

    <div class="box box2">
        Margin Right
    </div>

    <div class="box box3">
        Margin Bottom
    </div>

    <div class="box box4">
        Margin Left
    </div>

    <div class="center-box">
        Margin Auto
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Syntax</title>
    <style>
        h1 {
            color: purple;
            font-size: 45px;
        }

        /* paragraph styling */
        p {
            color: green;
            background-color: lightgray;
            text-align: center;
        }

        h2 {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <div>
        <h1>CSS Syntax</h1>
        <p>
            CSS uses selectors, properties, and values to style HTML5 elements.
        </p>
    </div>

    <div>
        <h2>Understanding CSS</h2>
    </div>

</body>

</html>

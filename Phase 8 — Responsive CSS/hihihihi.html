<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Website</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* =====================
           NAVBAR
        ====================== */

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 50px;

            background-color: #111;
            color: white;
        }

        .links {
            display: flex;
            gap: 25px;
        }

        .links a {
            color: white;
            text-decoration: none;
        }

        .menu {
            display: none;
            font-size: 25px;
            background: none;
            border: none;
            color: white;
        }


        /* =====================
           HERO
        ====================== */

        .hero {
            min-height: 400px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 50px;
        }

        .hero h1 {
            font-size: 60px;
        }


        /* =====================
           CARDS
        ====================== */

        .cards {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 20px;

            padding: 50px;
        }

        .card {
            padding: 30px;

            background-color: #eee;

            text-align: center;

            border-radius: 10px;
        }


        /* =====================
           TABLET
        ====================== */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero h1 {
                font-size: 45px;
            }

        }


        /* =====================
           MOBILE
        ====================== */

        @media (max-width: 600px) {

            .navbar {
                padding: 20px;
            }

            .links {
                display: none;
            }

            .menu {
                display: block;
            }

            .hero {
                padding: 30px 20px;
            }

            .hero h1 {
                font-size: 35px;
            }

            .cards {
                grid-template-columns: 1fr;
                padding: 20px;
            }

        }

    </style>

</head>

<body>


    <nav class="navbar">

        <h2>My Website</h2>

        <div class="links">

            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>

        </div>

        <button class="menu">☰</button>

    </nav>


    <section class="hero">

        <div>

            <h1>Responsive Website</h1>

            <p>Resize your browser window.</p>

        </div>

    </section>


    <section class="cards">

        <div class="card">
            <h2>HTML</h2>
            <p>Website structure.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Website styling.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Website functionality.</p>
        </div>

        <div class="card">
            <h2>React</h2>
            <p>Modern UI development.</p>
        </div>

    </section>


</body>

</html>

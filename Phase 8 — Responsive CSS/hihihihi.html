<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Images</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }


        /* =========================
           1. RESPONSIVE IMAGE
        ========================== */

        .responsive-image {
            max-width: 100%;
            height: auto;
            display: block;
        }


        /* =========================
           2. OBJECT-FIT
        ========================== */

        .image-box {
            width: 100%;
            max-width: 500px;
            height: 300px;
            margin-top: 30px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }


        /* =========================
           3. RESPONSIVE BACKGROUND
        ========================== */

        .hero {
            width: 100%;
            height: 500px;

            margin-top: 30px;

            background-image: url("../media/hero.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            text-align: center;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .image-box {
                height: 20
                0px;
            }

            .hero {
                height: 350px;

                background-image: url("../media/hero-mobile.jpg");
            }

        }

    </style>

</head>

<body>


    <h1>Responsive Images</h1>


    <!-- max-width + height:auto -->

    <h2>Responsive Image</h2>

    <img
        class="responsive-image"
        src="../media/nature.jpg"
        alt="Beautiful nature"
    >


    <!-- object-fit -->

    <h2>Object Fit</h2>

    <div class="image-box">

        <img
            src="../media/city.jpg"
            alt="City"
        >

    </div>


    <!-- Responsive Background -->

    <h2>Responsive Background</h2>

    <section class="hero">

        <div>

            <h1>Welcome to My Website</h1>

            <p>Responsive Background Image</p>

        </div>

    </section>


</body>

</html>

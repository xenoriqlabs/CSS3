<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RESPONSIVE IMAGEs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
        }

        .box {
            width: 80%;
            min-width: auto;
            border: 3px solid black;
            margin: 30px auto;
        }

        h2 {
            margin: 20px;
        }

        /* =========================
           1. RESPONSIVE IMAGE
        ========================== */

        .reponsive-image {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* =========================
           2. OBJECT-FIT
        ========================== */

        .image-box {
            width: 100%;
            max-width: 500px;
            height: 300px;
            margin-top: 30px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* =========================
           3. RESPONSIVE BACKGROUND
        ========================== */

        .hero {
            width: 100%;
            height: 500px;

            margin-top: 30px;

            background-image: url("../media/bg1-image.png");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            color: black;
            text-align: center;
        }

        /* =========================
           MOBILE
        ========================== */
        @media (max-width: 600px) {
            .image-box {
                height: 200px;
            }

            .hero {
                height: 350px;
                background-image: url(../media/bg2-image.png);
            }
        }
    </style>

</head>

<body>

    <h1 style="text-align: center; margin-bottom: 20px;">RESPONSIVE IMAGE</h1>

    <hr style="border-top: 2px solid aqua; width: 90%;">

    <div class="box">

        <h2>1 - Responsive Images</h2>

        <!-- max-width + height:auto -->

        <img class="reponsive-image" src="../media/xenoriq-labs-logo.jpeg" alt="xenoriq-labs-logo">

    </div>

    <div class="box">

        <!-- object-fit -->

        <h2>2 - Object Fit</h2>

        <div class="image-box">

            <img src="../media/xenoriq-labs-logo.jpeg" alt="xenoriq-labs-logo">

        </div>

    </div>

    <div class="box">
        <!-- Responsive Background -->

        <h2>3 - Responsive Background</h2>

        <section class="hero">

            <div>

                <h3>Welcome to My Website</h3>

                <p>Responsive Background Image</p>

            </div>

        </section>

    </div>

</body>

</html>

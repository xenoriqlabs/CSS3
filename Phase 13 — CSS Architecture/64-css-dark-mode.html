<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Dark Mode</title>

    <style>
        /* =====================================================
           1. GLOBAL RESET
        ====================================================== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =====================================================
           2. LIGHT THEME
        ====================================================== */

        :root {
            --bg-color: #ffffff;
            --surface-color: #f5f5f5;
            --card-color: #ffffff;
            --text-color: #222222;
            --muted-text-color: #666666;
            --border-color: #dddddd;
            --primary-color: #0066ff;
            --primary-hover-color: #0052cc;
            --header-color: #111111;
            --header-text-color: #ffffff;
            --success-color: #198754;
            --danger-color: #dc3545;

            --shadow-color: rgba(0, 0, 0, 0.10);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --surface-color: #1a1a1a;
                --card-color: #1e1e1e;
                --text-color: #f5f5f5;
                --muted-text-color: #b0b0b0;
                --border-color: #333333;
                --primary-color: #66a3ff;
                --primary-hover-color: #8bb9ff;
                --header-color: #000000;
                --header-text-color: #ffffff;
                --success-color: #4ade80;
                --danger-color: #ff6b6b;
                --shadow-color: rgba(0, 0, 0, 0.40);
            }
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;

            transition:
                background-color 0.3s ease, color 03 ease;
        }

        /* =====================================================
           5. CONTAINER
        ====================================================== */

        .container{
            width: min(1100px, 100% - 40px);
            margin-inline: auto;
            padding-block: 40px;
        }

                /* =====================================================
           6. HEADER
        ====================================================== */

        .header{
            padding: 20px;
            background-color: var(--header-color);
            color: var(--header-text-color);
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .header__title{
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header__text{
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

                <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">

            <h1 class="header__title">
                Xenoriq Labs
            </h1>

            <p class="header__text">
                CSS Light & Dark Mode
            </p>

        </header>
        
    </div>
</body>

</html>

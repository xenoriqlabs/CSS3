<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Dark Mode</title>

    <style>
        /* =====================================================
           1. GLOBAL RESET
        ====================================================== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =====================================================
           2. LIGHT THEME
        ====================================================== */

        :root {
            --bg-color: #ffffff;
            --surface-color: #f5f5f5;
            --card-color: #ffffff;
            --text-color: #222222;
            --muted-text-color: #666666;
            --border-color: #dddddd;
            --primary-color: #0066ff;
            --primary-hover-color: #0052cc;
            --header-color: #111111;
            --header-text-color: #ffffff;
            --success-color: #198754;
            --danger-color: #dc3545;
        }
    </style>
</head>

<body>

</body>

</html>

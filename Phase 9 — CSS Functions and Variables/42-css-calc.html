<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Calc</title>

    <style>
        /* GLOBAL VARIABLES */

        :root {
            --primary-color: #2563eb;
            --secondary-color: #111827;
            --text-color: #ffffff;

            --header-height: 80px;
            --footer-height: 70px;

            --page-spacing: 40px;
        }

        /* GLOBAL */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* HEADER */

        header {
            height: var(--header-height);

            background-color: var(--secondary-color);
            color: var(--text-color);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MAIN */

        main {
            min-height: calc(100vh - var(--header-height) - var(--footer-height));

            width: calc(100% - var(--page-spacing));
            margin: 0 auto;
            padding: calc(20px + 1vw);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CARD */

        .card {
            width: calc(100% - 20px);
            max-width: 600px;

            padding: calc(20px + 1vw);
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            text-align: center;
        }

        .card h1 {
            color: var(--primary-color);

            font-size: calc(24px + 1vw);

            margin-bottom: 15px;
        }

        .card p {
            font-size: calc(14px + 0.3vw);

            line-height: 1.6;
        }

        /* FOOTER */

        footer {
            height: var(--footer-height);

            background-color: var(--secondary-color);
            color: var(--text-color);

            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <header>
        <h2>Welcome to Xenoriq Labs 🚀</h2>
    </header>


    <main>

        <div class="card">

            <h1>CSS `calc()`</h1>

            <p>
                CSS calc() allows us to combine units and
                create dynamic and responsive layouts.
            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Xenoriq Labs
        </p>

    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS min max clamp - Xenoriq Labs</title>

    <style>
        
        /* GLOBAL VARIABLES */
        :root {
            --primary-color: #3563eb;
            --secondary-color: #111827;
            --text-color: #ffffff;
            --container-width: 1200px;
        }

        /* GLOBAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f3f4f6;
        }

        /* HEADER */
        header {
            background-color: var(--secondary-color);
            color: var(--text-color);

            padding: clamp(20px, 4vw, 50px);
            text-align: center;
        }

        header h1 {
            /* 
                Minimum: 28px
                Preferred: 5vw
                Maximum: 64px
            */

            font-size: clamp(28px, 5vw, 64px);
        }

        /* CONTAINER */
        .conatiner {

            /* 
                Chooses the smaller value
                between 90% and 1200px.
            */

            width: min(90%, var(--container-width));
            margin: 0 auto;
        }

        /* MAIN */
        main {
            padding: clamp(30px, 6vw, 80px) 0;
        }

        /* CARD */
        .card {
            /* 
                Width will never be smaller
                than 280px and never larger
                than 600px.
            */

            width: clamp(280px, 60vw, 600px);

            margin: 0 auto;
            background-color: white;
            padding: clamp(20px, 4vw, 50px);
            border-radius: 12px;
            text-align: center;
        }

        .card h2 {
            /*
                Responsive heading
            */

            font-size: clamp(22px, 4vw, 40px);
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .card p {

            /*
                Responsive paragraph
            */

            font-size: clamp(14px, 2vw, 20px);
            line-height: 1.6;
        }

        /* BUTTON */
        button {

            /*
                Padding will never be smaller
                than 10px and will grow up to 20px.
            */

            padding: max(10px, 1.5vw) max(20px, 3vw);
            margin-top: 25px;
            background-color: var(--primary-color);
            color: var(--text-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        /* FOOTER */
        footer {
            background-color: var(--secondary-color);
            color: var(--text-color);
            text-align: center;
            padding: max(20px, 3vw);
        }
    </style>
</head>

<body>

    <header>
        <h1>
            Welcome to Xenoriq Labs 🚀
        </h1>
    </header>

    <main>
        <div class="contanier">

            <div class="card">
                <h2>
                    Responsive CSS
                </h2>

                <p>
                    Using min(), max(), and clamp()
                    to create flexible and responsive
                    layouts.
                </p>

                <button>
                    Learn More
                </button>

            </div>

        </div>

    </main>

    <footer>
        <p>
            © 2026 Xenoriq Labs
        </p>
    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Flexbox Project</title>

    <style>
        /* =========================
           GLOBAL STYLES
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 8%;
            background-color: #222;
        }

        .logo {
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #00bcd4;
        }


        /* =========================
           HERO / CENTERING
        ========================= */

        .hero {
            min-height: 350px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 30px;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero h1 {
            margin-bottom: 15px;
        }

        .hero p {
            margin-bottom: 20px;
        }

        .hero button {
            padding: 12px 25px;
            border: none;
            background-color: #222;
            color: white;
            cursor: pointer;
        }


        /* =========================
           CARDS
        ========================= */

        .cards {
            width: 84%;
            margin: 0 auto 50px;

            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            flex: 1 1 250px;

            padding: 25px;
            background-color: white;

            border-radius: 8px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        .card h3 {
            margin-bottom: 15px;
        }

        .card p {
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .card button {
            padding: 10px 20px;

            border: none;
            background-color: #222;
            color: white;

            cursor: pointer;
        }


        /* =========================
           RESPONSIVE NAVBAR
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <h2 class="logo">
            MyWebsite
        </h2>

        <div class="nav-links">

            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>

        </div>

    </nav>


    <!-- =========================
         HERO SECTION
    ========================= -->

    <section class="hero">

        <div class="hero-content">

            <h1>
                Learn Web Development
            </h1>

            <p>
                Build modern and responsive websites
                using HTML, CSS and JavaScript.
            </p>

            <button>
                Get Started
            </button>

        </div>

    </section>


    <!-- =========================
         CARDS
    ========================= -->

    <section class="cards">

        <div class="card">

            <h3>HTML</h3>

            <p>
                HTML creates the structure
                of a web page.
            </p>

            <button>
                Learn More
            </button>

        </div>


        <div class="card">

            <h3>CSS</h3>

            <p>
                CSS is used to style and
                design web pages.
            </p>

            <button>
                Learn More
            </button>

        </div>


        <div class="card">

            <h3>JavaScript</h3>

            <p>
                JavaScript adds interaction
                and functionality.
            </p>

            <button>
                Learn More
            </button>

        </div>

    </section>

</body>

</html>

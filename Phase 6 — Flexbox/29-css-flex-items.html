<!--
    =======================
    CSS FLEX ITEMS
    =======================

    Flex Item Properties:

    1. order
    2. flex-grow
    3. flex-shrink
    4. flex-basis
    5. flex
    6. align-self

    NOTE:
    Flex Item properties are applied to the CHILD elements
    of a flex container.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flex Items</title>
    <style>
        *{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            padding: 30px;

            font-family: Arial, sans-serif;

            background-color: #f5f5f5;
        }

        h2{
            margin-bottom: 10px;
        }

        p{
            margin-top: 0;
        }

        section{
            width: 90%;
            margin: 60px auto;
        }

    </style>
</head>
<body>
    <h1 style="text-align: center;">CSS Flex Items</h1>

    <hr style="border-top: 2px solid aqua; width: 90%;">
</body>
</html>

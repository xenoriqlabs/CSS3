<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Opacity</title>

    <style>
        .box {
            width: 200px;
            height: 100px;
            margin: 20px;
            padding: 20px;
            background-color: blue;
            color: white;
        }

        .opacity-1 {
            opacity: 1;
        }

        .opacity-08 {
            opacity: 0.8;
        }

        .opacity-05 {
            opacity: 0.5;
        }

        .opacity-02 {
            opacity: 0.2;
        }

        .opacity-0 {
            opacity: 0;
        }
    </style>

</head>

<body>

    <h1>CSS Opacity</h1>

    <div class="box opacity-1">
        Opacity: 1
    </div>

    <div class="box opacity-08">
        Opacity: 0.8
    </div>

    <div class="box opacity-05">
        Opacity: 0.5
    </div>

    <div class="box opacity-02">
        Opacity: 0.2
    </div>

    <div class="box opacity-0">
        Opacity: 0
    </div>

</body>

</html>

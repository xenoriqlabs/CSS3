<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Z-Index</title>
    <style>
        .container {
            position: relative;
            width: 500px;
            height: 300px;
            margin: 50px auto;
            border: 2px solid black;
        }

        .box1 {
            position: absolute;
            top: 50px;
            left: 50px;

            width: 200px;
            height: 150px;

            background-color: red;

            z-index: 1;
        }

        .box2 {
            position: absolute;
            top: 100px;
            left: 150px;

            width: 200px;
            height: 150px;

            background-color: blue;

            z-index: 2;
        }
    </style>
</head>

<body>
    <h1 style="text-align: center;">CSS Z-Index</h1>

    <hr style="border-top: 2px solid aqua; width: 90%;">

    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
    </div>
</body>

</html>
